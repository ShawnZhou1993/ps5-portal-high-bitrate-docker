name: Release multi-arch image

# Build linux/amd64 + linux/arm64 on tag push and publish to ghcr.io.
# Default GITHUB_TOKEN has write access to packages; no extra secrets needed.
# Workflow also runs on main pushes (publish :main tag) for early breakage detection.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 包名与仓库名解耦：ghcr.io/<owner>/portal-relay（和本地构建标签 portal-relay:local 一致）
  IMAGE_NAME: ${{ github.repository_owner }}/portal-relay

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On tag v0.1.0 → tags: 0.1.0, latest
          # on main push → tag: main
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GHA cache for fast subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pass through to install-alpine.sh's pip
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            SOURCE_REV=${{ github.sha }}